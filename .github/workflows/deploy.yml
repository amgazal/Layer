name: Deploy Layer to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run regression checks
        run: npm run check:regressions

      - name: Run model unit tests
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build site
        run: npm run build
        env:
          # Public values — safe to expose; RLS protects the data.
          # Add them in: repo → Settings → Secrets and variables → Actions.
          # If unset, the build still succeeds and the app runs local-only.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional: comma list, e.g. "google,cornell". Blank = email-only sign-in.
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
