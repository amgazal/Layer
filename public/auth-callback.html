<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#112033" />
    <title>Signing in to Layer…</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#112033;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      body{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
      main{width:min(390px,100%);padding:30px 24px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(255,255,255,.07);box-shadow:0 24px 80px rgba(0,0,0,.28)}
      .spinner{display:inline-block;width:30px;height:30px;border:3px solid rgba(255,255,255,.22);border-top-color:#f2bd4c;border-radius:50%;animation:spin .8s linear infinite}
      h1{margin:18px 0 8px;font-size:28px}p{margin:0;color:rgba(255,255,255,.76);line-height:1.55}.done{display:none}.check{width:46px;height:46px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#2d8c61;font-weight:900;font-size:25px}
      button{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:14px;background:#f2bd4c;color:#112033;font-weight:800;font-size:15px;cursor:pointer}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <section id="working">
        <span class="spinner" aria-hidden="true"></span>
        <h1>Finishing your sign-in</h1>
        <p>Returning your Layer account to the tab you started from…</p>
      </section>
      <section id="done" class="done">
        <div class="check" aria-hidden="true">✓</div>
        <h1>You're all set</h1>
        <p>Your original Layer tab is finishing the sign-in. You can return to it now.</p>
        <button type="button" id="close">Close this tab</button>
      </section>
    </main>
    <script>
      (() => {
        const CHANNEL = "layer-auth-handoff-v2";
        const STORAGE_KEY = "layer:auth-code-handoff-v2";
        const current = new URL(window.location.href);
        const code = current.searchParams.get("code");
        const nonce = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

        function appDestination() {
          const dest = new URL("./", current);
          const params = new URLSearchParams(current.search);
          params.delete("layer_handoff");
          params.delete("layer_nonce");
          params.set("layer_auth_return", "1");
          dest.search = params.toString() ? `?${params.toString()}` : "";
          dest.hash = current.hash;
          return dest.href;
        }

        function continueHere() {
          // Fallback when the original Layer tab was closed or Safari suspended
          // it too aggressively. The app root can complete Supabase's PKCE code
          // exchange in this tab because it shares the same origin/storage.
          window.location.replace(appDestination());
        }

        if (!code) {
          continueHere();
          return;
        }

        let channel = null;
        let acknowledged = false;
        let completed = false;
        const payload = { type: "layer-auth-code", nonce, code, at: Date.now() };

        const showDone = () => {
          document.getElementById("working").style.display = "none";
          document.getElementById("done").style.display = "block";
        };

        try {
          channel = new BroadcastChannel(CHANNEL);
          channel.onmessage = (event) => {
            const data = event.data || {};
            if (data.nonce !== nonce) return;
            if (data.type === "layer-auth-ack") acknowledged = true;
            if (data.type === "layer-auth-complete") {
              completed = true;
              try { localStorage.removeItem(STORAGE_KEY); } catch {}
              showDone();
            }
            if (data.type === "layer-auth-error") {
              try { localStorage.removeItem(STORAGE_KEY); } catch {}
              setTimeout(continueHere, 250);
            }
          };
          channel.postMessage(payload);
        } catch {}

        // Storage events cover browsers that suspend BroadcastChannel delivery
        // while the original tab is backgrounded.
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch {}

        // No original tab answered: complete the same one-time code in this tab.
        setTimeout(() => {
          if (!acknowledged && !completed) continueHere();
        }, 2800);

        // If the old tab accepted the code but cannot report completion, leave a
        // useful escape route instead of keeping an endless spinner.
        setTimeout(() => {
          if (acknowledged && !completed) continueHere();
        }, 12000);

        document.getElementById("close").addEventListener("click", () => {
          window.close();
          setTimeout(() => { window.location.href = new URL("./", current).href; }, 150);
        });
      })();
    </script>
  </body>
</html>
